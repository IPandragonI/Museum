<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hors connexion · MUSEUM</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f6f2ea; color: #1b1915; font-family: Georgia, "Times New Roman", serif; text-align: center; padding: 24px; }
      @media (prefers-color-scheme: dark) { body { background: #121110; color: #efe9de; } }
      h1 { font-weight: 400; font-size: clamp(2.4rem, 8vw, 4rem); margin: 0 0 12px; letter-spacing: -0.01em; }
      p { font-family: system-ui, sans-serif; opacity: 0.7; max-width: 34ch; margin: 0 auto 24px; line-height: 1.6; }
      a { font-family: system-ui, sans-serif; color: inherit; border: 1px solid currentColor; padding: 12px 22px; text-decoration: none; border-radius: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1 id="t">La galerie est fermée.</h1>
      <p id="b">Vous êtes hors connexion et cette page n’a pas encore été enregistrée. Votre collection et votre progression sont en sécurité sur cet appareil.</p>
      <a id="a" href="/">Réessayer</a>
    </main>
    <script>
      // The offline page is static: pick the saved language (set in Settings), else the browser language.
      try {
        var s = JSON.parse(localStorage.getItem("museum:settings") || "null");
        var lang = (s && s.lang) || ((navigator.language || "fr").slice(0, 2) === "en" ? "en" : "fr");
        if (s && !s.lang) lang = "fr";
        if (lang === "en") {
          document.documentElement.lang = "en";
          document.title = "Offline · MUSEUM";
          document.getElementById("t").textContent = "The gallery is closed.";
          document.getElementById("b").textContent = "You’re offline and this page hasn’t been saved yet. Your collection and progress are safe on this device.";
          document.getElementById("a").textContent = "Try again";
        }
      } catch (e) {}
    </script>
  </body>
</html>
